<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
    <meta name="description" content="A simple, local-first markdown note-taking app.">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
</head>

<body>
    <header>
        <div class="header-left">
            <h1>Notes</h1>
        </div>
        <div id="file-status" class="header-center" hidden>
            <span id="current-filename"></span>
            <span id="unsaved-indicator" hidden>• Unsaved</span>
        </div>
        <div class="header-right">
            <button id="save-btn" class="primary-btn" disabled hidden>Save</button>
            <button id="restore-btn" class="secondary-btn" hidden title="Restore last session">Restore</button>
            <button id="open-dir-btn" class="secondary-btn">Open Folder</button>
            <button id="load-demo-btn" class="secondary-btn">Demo</button>
        </div>
    </header>

    <div class="container">
        <nav id="file-tree" class="file-tree" aria-label="File Navigation">
            <div class="empty-state"></div>
        </nav>

        <main id="editor-container">
            <div id="welcome-message" class="empty-state">
                <p>Open a folder</p>
            </div>
            <div id="editor-view" hidden>
                <div class="editor-wrapper">
                    <textarea id="editor" spellcheck="false"></textarea>
                </div>
            </div>
        </main>
    </div>



    <!-- Unsaved Changes Dialog -->
    <dialog id="unsaved-dialog" aria-labelledby="unsaved-dialog-title">
        <div class="dialog-content">
            <h3 id="unsaved-dialog-title">Unsaved Changes</h3>
            <p>You have unsaved changes. Are you sure you want to discard them?</p>
            <div class="dialog-actions">
                <button id="cancel-nav-btn" class="secondary-btn">Cancel</button>
                <button id="discard-changes-btn" class="primary-btn danger-btn">Discard</button>
            </div>
        </div>
    </dialog>

    <script type="module" src="src/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</body>

</html>
